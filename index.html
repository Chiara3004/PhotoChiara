<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galleria fotografica di Chiara Obert</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link type="text/css" rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.knightlab.com/libs/timeline3/latest/css/timeline.css">
  <script src="https://cdn.knightlab.com/libs/timeline3/latest/js/timeline.js"></script>
  <script src="script.js" defer></script>
</head>
<body class="index-page">

  <div class="page-layout">

    <!-- Header -->
    <header class="header-container grid-header">
      <div id="logo-start">
        <img id="logo-start-img" src="sfondi/infoII.png" alt="Logo">
      </div>
      <h1>Photo Chiara</h1>
      <div id="logo-end">
        <img id="logo-end-img" src="sfondi/infoII.png" alt="Logo">
      </div>
    </header>

    <!-- Navigazione -->
    <nav id="navigazione" class="grid-nav" aria-label="Menu principale">
      <button class="hamburger" id="hamburgerBtn" aria-label="Apri menu">
        <span></span><span></span><span></span>
      </button>

      <ul class="menù" id="navMenu">
        <li><a href="index.html" class="active" title="Vai a home">Home</a></li>
        <li><a href="About.html" title="Vai ad About">About</a></li>
        <li class="dropdown">
          <a href="index.html" class="dropdown-btn">Photos ▾</a>
          <ul class="submenù"> 
            <li><a href="index.html" class="category-link" data-tag="streetphotography">Street Photography</a></li>
            <li><a href="index.html" class="category-link" data-tag="closeup">Close Up</a></li>
            <li><a href="index.html" class="category-link" data-tag="landscape">Landscape</a></li>
          </ul>
        </li>

        <li class="search-menu-item">
          <form id="searchForm" role="search" onsubmit="return false;">
            <input type="search" id="searchInput" placeholder="Cerca..." aria-label="Cerca foto">
            <button type="submit" aria-label="Cerca">🔍</button>
          </form>
        </li>

        <li class="theme-menu-item">
          <div class="mode-toggle">
            <button id="dayBtn" title="Modalità Giorno" aria-label="Passa a modalità giorno">☀️</button>
            <button id="nightBtn" title="Modalità Notte" aria-label="Passa a modalità notte">🌙</button>
          </div>
        </li>
      </ul>    
    </nav>

    <!-- Contenuto Principale (Spazio esteso senza Sidebar) -->
    <main class="grid-main">
      
      <!-- Testo Introduttivo Centrale sopra la galleria -->
      <section class="intro-text-container">
        <div class="linea"></div>
        <p class="intro-text">
          Benvenuti nella mia galleria fotografica. Esplorate gli scatti divisi per categorie o utilizzate la barra di ricerca per trovare foto specifiche.
        </p>
        <div class="linea"></div>
      </section>

      <!-- Galleria Fotografica -->
      <div class="photocontainer"></div>
      <div class="timeline"></div>
      <div class="dettagliflip"></div>
    </main>

    <!-- Pannello Dettagli Dinamico -->
    <aside class="grid-details details-container"></aside>

    <!-- Footer -->
    <footer id="piedipagina" class="grid-footer">
      <div class="linea"></div> 
      <p>&copy; 2025 Chiara Obert</p>
    </footer>

  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const introContainer = document.querySelector('.intro-text-container');

      if (introContainer) {
        // Attende 5 secondi (5000 ms) prima di avviare l'animazione
        setTimeout(() => {
          // Aggiunge la classe CSS che riduce altezza, margini e opacità in modo fluido
          introContainer.classList.add('scomparso');

          // Rimuove completamente il blocco dal layout dopo la fine dell'animazione (1.2s = 1200 ms)
          setTimeout(() => {
            introContainer.style.display = 'none';
          }, 1200);
        }, 5000); 
      }
    });
  </script>
</body>
</html>
